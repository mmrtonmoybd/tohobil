    <rect x="56" y="94" width="188" height="132" rx="22" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" />
    <path d="M 198 136 L 236 136 C 246 136 254 144 254 154 C 254 164 246 172 236 172 L 198 172 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
    <circle cx="235" cy="154" r="6" fill="#14B8A6" />

