    <g fill="#14B8A6">
      <path d="M 126 126 C 117 126 109 133 109 142 C 109 151 115 157 125 157 C 133 157 139 152 141 145 C 144 151 150 156 158 156 C 168 156 174 148 174 139 L 174 130 L 162 130 L 162 139 C 162 142 160 145 156 145 C 153 145 149 141 149 136 L 149 126 Z M 125 137 C 128 137 131 140 131 143 C 131 146 128 148 125 148 C 122 148 119 146 119 143 C 119 140 122 137 125 137 Z" />
      <path d="M 162 146 L 162 194 C 162 197 159 200 156 200 C 153 200 150 197 150 194 L 150 180 L 138 180 L 138 194 C 138 204 146 211 156 211 C 166 211 174 204 174 194 L 174 146 Z" />
      <rect x="142" y="166" width="40" height="11" rx="5.5" fill="#6366F1" />
